<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Date Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff6f2; --surface: #ffffff; --text: #2a1a1f; --muted: #7a6368; --line: #ecd9d4;
  --a1: #d9453b; --a2: #b0305a; --a3: #5b2a5e; --a4: #b7791f;
  --amix: linear-gradient(135deg, #d9453b, #b0305a 55%, #5b2a5e);
  --accent: var(--a1); --accent-bg: var(--a1);
  --on-accent: #fff; --shadow: 0 10px 30px rgba(90, 30, 40, .15);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1015; --surface: #281a20; --text: #f7e9e6; --muted: #b79ea4; --line: #44303a;
    --a1: #ff6b5e; --a2: #e8618f; --a3: #b57ab8; --a4: #f0b04a;
    --amix: linear-gradient(135deg, #ff6b5e, #e8618f 55%, #b57ab8);
    --on-accent: #1a1015; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
}
body[data-mode="1"] { --accent: var(--a1); --accent-bg: var(--a1); }
body[data-mode="2"] { --accent: var(--a2); --accent-bg: var(--a2); }
body[data-mode="3"] { --accent: var(--a3); --accent-bg: var(--a3); }
body[data-mode="mix"] { --accent: var(--a2); --accent-bg: var(--amix); }
.app { width: 100%; max-width: 480px; padding: 12px 16px 24px; display: flex; flex-direction: column; flex: 1; }
main { flex: 1; display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 18px; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .mode-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .5; }
.btn {
  min-height: 48px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 16px;
}
.btn.primary { background: var(--accent-bg); border-color: transparent; color: var(--on-accent); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn.ghost { background: transparent; }
.hdr-actions { display: flex; gap: 6px; }
[hidden] { display: none !important; }

/* start */
.hero { text-align: center; margin: 24px 0 20px; }
.hero h1 { font-family: var(--serif); font-size: 40px; line-height: 1.1; margin: 0 0 10px; }
.hero p { color: var(--muted); margin: 0; font-size: 17px; }
.modes { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.mode-card {
  width: 100%; text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px;
  background: var(--surface); border: 2px solid var(--line); display: flex; align-items: center; gap: 14px;
  position: relative;
}
.mode-card .dot { width: 14px; align-self: stretch; border-radius: 8px; background: var(--accent-bg); flex: none; }
.mode-card .meta { flex: 1; min-width: 0; }
.mode-card .name { font-weight: 600; font-size: 18px; display: block; }
.mode-card .desc { color: var(--muted); font-size: 14px; display: block; }
.mode-card .count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mode-card.suggested { border-color: var(--accent); }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--accent-bg); color: var(--on-accent);
  border-radius: 99px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }

/* play */
#play { flex: 1; display: flex; flex-direction: column; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 4px; }
.tab { min-height: 44px; padding: 0 2px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.tab[aria-pressed="true"] { background: var(--accent-bg); color: var(--on-accent); border-color: transparent; }
.progress { text-align: center; color: var(--muted); font-weight: 600; margin: 10px 0; font-variant-numeric: tabular-nums; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1200px; padding: 8px 0; }
.card {
  width: 100%; min-height: 320px; border-radius: 24px; padding: 32px 24px; background: var(--surface);
  border: 2px solid var(--line); border-top: 10px solid var(--accent); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px;
}
.card.flip { animation: flip .38s ease both; }
@keyframes flip { from { transform: rotateY(-70deg) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.badge { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--on-accent); border-radius: 99px; padding: 3px 10px; }
.badge[data-level="1"] { background: var(--a1); } .badge[data-level="2"] { background: var(--a2); } .badge[data-level="3"] { background: var(--a3); } .badge[data-level="wild"] { background: var(--a4); }
.question { font-family: var(--serif); font-size: 26px; line-height: 1.3; margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@media (min-width: 480px) { .question { font-size: 28px; } }
.controls { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 12px; }
.complete { margin-top: 12px; padding: 16px; border: 2px solid var(--accent); border-radius: 18px; background: var(--surface); display: grid; gap: 10px; text-align: center; }
.complete h2 { font-family: var(--serif); margin: 0; font-size: 22px; }

/* dialog */
dialog { border: 0; border-radius: 18px; padding: 22px; max-width: 360px; width: calc(100% - 32px); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
dialog h2 { margin: 0 0 8px; font-family: var(--serif); }
dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { .card.flip { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="brand">First Date Deck</p>
    <div class="hdr-actions">
      <button class="btn small ghost" id="btn-levels" hidden>Levels</button>
      <button class="btn small ghost" id="btn-restart">Restart all</button>
    </div>
  </header>

  <main>
    <section id="start" hidden>
      <div class="hero">
        <h1>First Date Deck</h1>
        <p>Draw a card, answer out loud, and let the conversation wander.</p>
      </div>
      <ul class="modes" id="mode-list"></ul>
    </section>

    <section id="play" hidden>
      <div class="tabs" id="tabs" role="group" aria-label="Switch mode"></div>
      <div class="progress" id="progress"></div>
      <div class="stage">
        <article class="card" id="card">
          <span class="badge" id="badge" hidden></span>
          <p class="question" id="question" aria-live="polite"></p>
        </article>
      </div>
      <div class="controls" id="controls">
        <button class="btn" id="btn-prev">Previous</button>
        <button class="btn primary" id="btn-next">Next</button>
      </div>
      <div class="complete" id="complete" hidden>
        <h2 id="complete-title">Level complete</h2>
        <button class="btn primary" id="c-primary"></button>
        <button class="btn" id="c-secondary" hidden></button>
        <button class="btn ghost" id="c-back">Back to levels</button>
        <button class="btn small ghost" id="c-prev">Previous</button>
      </div>
    </section>
  </main>
</div>

<dialog id="confirm">
  <h2>Restart all?</h2>
  <p>Every deck will be reshuffled and your progress cleared.</p>
  <div class="row">
    <button class="btn" id="confirm-no">Cancel</button>
    <button class="btn primary" id="confirm-yes">Restart</button>
  </div>
</dialog>

const MODES = [1, 2, 3, "mix"];
const MODE_INFO = {
  1: { name: "Level 1 · Perception", desc: "First impressions and guesses, plus wildcards" },
  2: { name: "Level 2 · Connection", desc: "Values and experiences, plus wildcards" },
  3: { name: "Level 3 · Reflection", desc: "Reflecting on the date and each other, plus wildcards" },
  mix: { name: "Mix", desc: "Everything from levels 1–3 and the wildcards" },
};
const STORAGE_KEY = "fdd-state";
const FLIP_MS = 380;

/* ========== 2. STATE ========== */
const QS = dedupe(QUESTIONS);
const BY_ID = new Map(QS.map(q => [q.id, q]));
let state = loadState();

function dedupe(list) {
  const seen = new Set();
  return list.filter(q => {
    if (seen.has(q.id)) { console.warn("Duplicate question id dropped:", q.id); return false; }
    seen.add(q.id);
    return true;
  });
}
// A level's pool is its own questions plus the shared wildcards; Mix holds each question once.
function poolIds(mode) {
  return QS.filter(q => mode === "mix" || q.level === mode || q.level === "wild").map(q => q.id);
}
function freshState() {
  const s = { currentMode: null, remaining: {}, history: {}, viewIndex: -1 };
  MODES.forEach(m => { s.remaining[m] = poolIds(m); s.history[m] = []; });
  return s;
}
// Keep saved progress but reconcile it with the current question list.
function loadState() {
  const s = freshState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || typeof saved !== "object") return s;
    MODES.forEach(m => {
      const pool = new Set(poolIds(m));
      const hist = ((saved.history && saved.history[m]) || []).filter((id, i, a) => pool.has(id) && a.indexOf(id) === i);
      const done = new Set(hist);
      const rem = ((saved.remaining && saved.remaining[m]) || []).filter((id, i, a) => pool.has(id) && !done.has(id) && a.indexOf(id) === i);
      const known = new Set([...hist, ...rem]);
      poolIds(m).forEach(id => { if (!known.has(id)) rem.push(id); });
      s.history[m] = hist; s.remaining[m] = rem;
    });
    if (MODES.includes(saved.currentMode)) s.currentMode = saved.currentMode;
    s.viewIndex = Number.isInteger(saved.viewIndex) ? saved.viewIndex : -1;
    if (s.currentMode !== null) {
      const n = s.history[s.currentMode].length;
      if (s.viewIndex < 0 || s.viewIndex >= n) s.viewIndex = n - 1;
    }
  } catch (e) { /* storage unavailable or corrupt: start fresh */ }
  return s;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

/* ========== 3. PURE FUNCTIONS ========== */
// Pick a random id from remaining[mode], move it to history. Returns the id or null.
function draw(s, mode, rng = Math.random) {
  const rem = s.remaining[mode];
  if (!rem.length) return null;
  const id = rem.splice(Math.floor(rng() * rem.length), 1)[0];
  s.history[mode].push(id);
  return id;
}
function isComplete(s, mode) {
  return s.remaining[mode].length === 0 && s.history[mode].length > 0;
}
// Refill one pool (reshuffled) and clear its history.
function resetMode(s, mode, rng = Math.random) {
  const ids = poolIds(mode);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  s.remaining[mode] = ids;
  s.history[mode] = [];
  if (s.currentMode === mode) s.viewIndex = -1;
}
function resetAll(s) {
  MODES.forEach(m => resetMode(s, m));
}

/* ========== 4. RENDERING ========== */
const $ = id => document.getElementById(id);
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;

function render(animate) {
  const mode = state.currentMode;
  document.body.dataset.mode = mode === null ? "1" : String(mode);
  $("start").hidden = mode !== null;
  $("play").hidden = mode === null;
  $("btn-levels").hidden = mode === null;
  if (mode === null) renderStart(); else renderPlay(animate);
}

function renderStart() {
  const list = $("mode-list");
  list.textContent = "";
  MODES.forEach(m => {
    const total = poolIds(m).length;
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "mode-card" + (m === 1 && total ? " suggested" : "");
    const v = m === "mix" ? "--a2" : "--a" + m;
    b.style.setProperty("--accent", `var(${v})`);
    b.style.setProperty("--accent-bg", `var(${m === "mix" ? "--amix" : v})`);
    b.disabled = total === 0;
    const label = MODE_INFO[m];
    b.innerHTML = '<span class="dot"></span><span class="meta"><span class="name"></span><span class="desc"></span></span><span class="count"></span>';
    b.querySelector(".name").textContent = label.name;
    if (m === 1 && total) {
      const t = document.createElement("span");
      t.className = "tag"; t.textContent = "Start here";
      b.querySelector(".name").appendChild(t);
    }
    b.querySelector(".desc").textContent = total ? label.desc : "No questions yet";
    b.querySelector(".count").textContent = `${state.history[m].length} / ${total}`;
    b.addEventListener("click", () => setMode(m));
    li.appendChild(b);
    list.appendChild(li);
  });
}

function renderPlay(animate) {
  const mode = state.currentMode;
  const hist = state.history[mode];
  const total = poolIds(mode).length;

  const tabs = $("tabs");
  tabs.textContent = "";
  MODES.forEach(m => {
    const t = document.createElement("button");
    t.className = "tab";
    t.textContent = m === "mix" ? "Mix" : "L" + m;
    t.setAttribute("aria-label", MODE_INFO[m].name);
    t.setAttribute("aria-pressed", String(m === mode));
    t.disabled = poolIds(m).length === 0;
    t.addEventListener("click", () => { if (m !== state.currentMode) setMode(m); });
    tabs.appendChild(t);
  });

  const q = BY_ID.get(hist[state.viewIndex]);
  const card = $("card");
  $("question").textContent = q ? q.text : total ? "Tap Next to draw your first card." : "No questions yet";
  const badge = $("badge");
  badge.hidden = !(q && (mode === "mix" || q.level === "wild"));
  if (!badge.hidden) { badge.dataset.level = q.level; badge.textContent = q.level === "wild" ? "Wildcard" : "Level " + q.level; }
  $("progress").textContent = `${Math.max(state.viewIndex + 1, 0)} / ${total}`;

  if (animate && !reducedMotion()) {
    card.classList.remove("flip");
    void card.offsetWidth;
    card.classList.add("flip");
  }

  const finished = isComplete(state, mode) && state.viewIndex === hist.length - 1;
  $("controls").hidden = finished;
  $("complete").hidden = !finished;
  $("btn-prev").disabled = state.viewIndex <= 0;
  $("btn-next").disabled = busy || total === 0;
  if (finished) renderComplete(mode);
}

function renderComplete(mode) {
  const p = $("c-primary"), s = $("c-secondary");
  $("complete-title").textContent = mode === "mix" ? "Mix complete" : `Level ${mode} complete`;
  s.hidden = mode === "mix";
  if (mode === 1 || mode === 2) {
    p.textContent = `Move to Level ${mode + 1}`; p.dataset.action = "goto"; p.dataset.target = mode + 1;
    s.textContent = "Replay this level";
  } else if (mode === 3) {
    p.textContent = "Try Mix"; p.dataset.action = "goto"; p.dataset.target = "mix";
    s.textContent = "Replay Level 3";
  } else {
    p.textContent = "Reshuffle Mix"; p.dataset.action = "replay";
  }
}

/* ========== 5. ACTIONS & EVENT WIRING ========== */
function setMode(mode) {
  state.currentMode = mode;
  state.viewIndex = state.history[mode].length - 1;
  if (state.viewIndex < 0 && draw(state, mode) !== null) state.viewIndex = 0;
  saveState();
  render(true);
  lockNext();
}
// Disable Next while the card transition plays so a double tap can't draw twice.
function lockNext() {
  busy = !reducedMotion();
  if (!busy) return;
  $("btn-next").disabled = true;
  setTimeout(() => {
    busy = false;
    if (state.currentMode !== null) $("btn-next").disabled = poolIds(state.currentMode).length === 0;
  }, FLIP_MS);
}
function goLevels() {
  state.currentMode = null;
  saveState();
  render(false);
}
function next() {
  const mode = state.currentMode;
  if (mode === null || busy) return;
  const last = state.history[mode].length - 1;
  if (state.viewIndex < last) state.viewIndex = last;
  else if (draw(state, mode) !== null) state.viewIndex = state.history[mode].length - 1;
  else return;
  saveState();
  render(true);
  lockNext();
}
function prev() {
  if (state.currentMode === null || state.viewIndex <= 0) return;
  state.viewIndex--;
  saveState();
  render(true);
}
function replay() {
  resetMode(state, state.currentMode);
  setMode(state.currentMode);
}

$("btn-next").addEventListener("click", next);
$("btn-prev").addEventListener("click", prev);
$("c-prev").addEventListener("click", prev);
$("c-back").addEventListener("click", goLevels);
$("btn-levels").addEventListener("click", goLevels);
$("c-primary").addEventListener("click", e => {
  const d = e.currentTarget.dataset;
  if (d.action === "goto") setMode(d.target === "mix" ? "mix" : Number(d.target)); else replay();
});
$("c-secondary").addEventListener("click", replay);

const dlg = $("confirm");
$("btn-restart").addEventListener("click", () => dlg.showModal());
$("confirm-no").addEventListener("click", () => dlg.close());
$("confirm-yes").addEventListener("click", () => {
  dlg.close();
  resetAll(state);
  state.currentMode = null;
  state.viewIndex = -1;
  saveState();
  render(false);
});

document.addEventListener("keydown", e => {
  if (dlg.open || state.currentMode === null || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if ((e.key === " " || e.key === "Enter") && e.target.tagName !== "BUTTON") {
    e.preventDefault();
    if ($("complete").hidden) next();
  }
});

/* ========== 6. SELF-TEST ========== */
// Run runSelfTest() in the console. Works on a throwaway state, not the saved one.
function runSelfTest() {
  const s = freshState();
  MODES.forEach(m => {
    const expected = poolIds(m);
    const seen = new Map();
    let id;
    while ((id = draw(s, m)) !== null) seen.set(id, (seen.get(id) || 0) + 1);
    const ok = seen.size === expected.length && expected.every(e => seen.get(e) === 1)
      && s.history[m].length === expected.length && isComplete(s, m) === (expected.length > 0);
    console.assert(ok, `mode ${m}: each id should appear exactly once`);
    if (!ok) throw new Error("Self-test failed for mode " + m);
  });
  console.log("runSelfTest: all modes OK", MODES.map(m => `${m}:${poolIds(m).length}`).join(" "));
  return true;
}

/* ========== INIT ========== */
render(false);
</script>
</body>
</html>
